# Webサーバー層（Apache / デモ用の最小構成）
# メンテナンス関連の設定は config/htaccess.sample を Include して、そのまま使う。

ServerRoot "/usr/local/apache2"
Listen 80
ServerName localhost
User daemon
Group daemon

LoadModule mpm_event_module   modules/mod_mpm_event.so
LoadModule authz_core_module  modules/mod_authz_core.so
LoadModule mime_module        modules/mod_mime.so
LoadModule log_config_module  modules/mod_log_config.so
LoadModule unixd_module       modules/mod_unixd.so
LoadModule dir_module         modules/mod_dir.so
LoadModule alias_module       modules/mod_alias.so
LoadModule rewrite_module     modules/mod_rewrite.so
LoadModule headers_module     modules/mod_headers.so
LoadModule proxy_module       modules/mod_proxy.so
LoadModule proxy_fcgi_module  modules/mod_proxy_fcgi.so

ErrorLog /proc/self/fd/2
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog /proc/self/fd/1 common
TypesConfig conf/mime.types

<Directory />
    AllowOverride None
    Require all denied
</Directory>

DocumentRoot "/usr/local/apache2/htdocs"
<Directory "/usr/local/apache2/htdocs">
    AllowOverride None
    Require all granted
</Directory>
DirectoryIndex index.php index.html

# メンテ画面は public/ を別の場所にマウントし、Alias で公開する
# （ErrorDocument /maintenance.html の解決先）
Alias /maintenance.html /usr/local/apache2/maintenance/maintenance.html
<Directory "/usr/local/apache2/maintenance">
    Require all granted
</Directory>

# PHP は FPM（別コンテナ）へ。落ちたら 502/503 → ErrorDocument が拾う。
# retry=0 : 一度失敗しても、次のリクエストでまた接続を試す（復旧を早く反映するため）
<Proxy "fcgi://php:9000">
    ProxySet retry=0 connectiontimeout=3 timeout=30
</Proxy>
<FilesMatch "\.php$">
    SetHandler "proxy:fcgi://php:9000"
</FilesMatch>

# ▼ ここがこのテンプレートの本体。リポジトリの htaccess.sample を、そのまま読み込む。
Include conf/maintenance.conf

# どの層が返したかを見分けるための印（デモ用）
<Files "maintenance.html">
    Header always set X-Maintenance-Layer "web-apache"
</Files>

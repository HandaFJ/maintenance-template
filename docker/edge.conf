# エッジ層（デモ用）
# 本番では Cloudflare / CloudFront が担う役割を、Nginx で模擬している。
# config/edge/ の設定との違い: web 層が返した 503 は「すでにメンテ画面」なので素通しし、
# 502 / 504（web 層に繋がらない・応答しない）のときだけ、エッジ自身が画面を返す。
# こうすることで、どの層が返したかを X-Maintenance-Layer ヘッダーで見分けられる。

server {
    listen 80;

    # Docker の内蔵 DNS。web が停止・再作成されても、毎回名前を引き直せるようにする
    resolver 127.0.0.11 valid=2s ipv6=off;

    location / {
        set $web http://web:80;
        proxy_pass $web;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        proxy_connect_timeout 2s;
        proxy_read_timeout    30s;

        proxy_intercept_errors on;
        error_page 502 504 =503 @edge_maintenance;
    }

    location @edge_maintenance {
        root /usr/share/nginx/maintenance;
        rewrite ^ /maintenance.html break;

        add_header Retry-After          3600      always;
        add_header Cache-Control        "no-store" always;
        add_header X-Robots-Tag         "noindex" always;
        add_header X-Maintenance-Layer  "edge"    always;
    }
}

# Webサーバー層（Nginx / デモ用）
# config/nginx.conf.sample の本質部分を、Docker 用にパスだけ変えた最小版。
# 変更点: server_name / root / fastcgi_pass、フラグの置き場所、X-Maintenance-Layer の追加。

geo $maintenance_bypass {
    default 0;    # デモでは edge 経由のため、クライアント IP での除外は使わない
}

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.php;

    resolver 127.0.0.11 valid=2s ipv6=off;

    # 手動スイッチ: make flag-on / make flag-off
    set $maintenance "";
    if (-f /var/www/maintenance.flag) {
        set $maintenance "on";
    }
    if ($maintenance_bypass = 1) {
        set $maintenance "";
    }
    if ($maintenance = "on") {
        return 503;
    }

    # 自動フォールバック
    error_page 502 503 504 =503 @maintenance;

    location @maintenance {
        root /usr/share/nginx/maintenance;
        rewrite ^ /maintenance.html break;

        add_header Retry-After          3600          always;
        add_header Cache-Control        "no-store"    always;
        add_header X-Robots-Tag         "noindex"     always;
        add_header X-Maintenance-Layer  "web-nginx"   always;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;

        # 変数経由にすると、php コンテナが再作成されても名前を引き直せる
        set $php_upstream php:9000;
        fastcgi_pass $php_upstream;

        fastcgi_intercept_errors on;
        fastcgi_connect_timeout 3s;
        fastcgi_read_timeout    30s;
    }
}
